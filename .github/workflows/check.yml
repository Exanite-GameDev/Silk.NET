name: Check

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  nuget:
    name: Check
    runs-on: ubuntu-24.04
    
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    
    steps:

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.100"

      - name: Cache .git folder
        uses: actions/cache@v6
        with:
          path: .git
          key: git-silk2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/.gitmodules') }}

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          lfs: false
          fetch-depth: 0
          filter: tree:0

      - name: Rewrite namespaces
        run: dotnet run --project exanite/Exanite.Silk2.Cli/Exanite.Silk2.Cli.csproj --configuration Release

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build
